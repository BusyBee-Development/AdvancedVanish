name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: gradle
      - name: Build and test
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --console=plain build
          else
            gradle --no-daemon --console=plain build
          fi
      - name: Check artifact
        run: |
          mkdir -p ci-out
          # Deployable jars only (skip sources/javadoc/plain helper jars)
          find . -path '*/build/libs/*.jar' -not -path './ci-out/*' \
            -not -name '*-sources.jar' -not -name '*-javadoc.jar' -not -name '*-plain.jar' > ci-out/jars.txt
          if [ ! -s ci-out/jars.txt ]; then echo "No jar produced"; exit 1; fi
          # Server APIs and test libs must never end up inside a shipped jar
          while read -r jar; do
            jar tf "$jar" > ci-out/contents.tmp
            if grep -Eq '^(org/bukkit|io/papermc|org/junit|org/mockito)/' ci-out/contents.tmp; then
              echo "Unshaded server/test classes found in $jar"; exit 1
            fi
            cp "$jar" ci-out/
          done < ci-out/jars.txt
          rm -f ci-out/contents.tmp ci-out/jars.txt
          (cd ci-out && sha256sum *.jar > SHA256SUMS)
          find . -path '*/build/test-results/*.xml' -exec cp --backup=numbered {} ci-out/ \; || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.event.repository.name }}-java-${{ matrix.java }}
          path: ci-out/
